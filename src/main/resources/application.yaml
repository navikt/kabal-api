spring:
  application:
    name: kabal-api
  main:
    banner-mode: OFF
  web:
    resources:
      add-mappings: false
    error:
      include-message: never
      include-stacktrace: never
  datasource:
    url: ${NAIS_DATABASE_KABAL_API_PRIV_KABAL_API_JDBC_URL}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    clean-disabled: true
    schemas: flyway_history_schema,klage
    connect-retries: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      org:
        hibernate:
          envers:
            store_data_at_delete: true
      hibernate:
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      enabled: false
  sql:
    init:
      platform: postgresql

server:
  port: 7081
  error:
    whitelabel:
      enabled: false
  shutdown: graceful
  http2:
    enabled: true
  jetty:
    threads:
      max: 600

management:
  health:
    elasticsearch:
      enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus
    base-path: "/internal"
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

